# SyncMe baseline build of the unmodified Nextcloud Talk 25.0.2 source.
# SPDX-License-Identifier: GPL-3.0-or-later
name: SyncMe Talk baseline APK
on:
  push:
    branches:
      - 'syncme/stable-25.0.2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Compile independent QA debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleQaDebug --no-daemon --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: syncme-talk-25.0.2-baseline-qa-debug
          path: app/build/outputs/apk/qa/debug/*.apk
          if-no-files-found: error
          retention-days: 14
