# SyncMe baseline build of the unmodified Nextcloud Talk 25.0.2 source.
# SPDX-License-Identifier: GPL-3.0-or-later
name: SyncMe Talk baseline APK
on:
  push:
    branches:
      - 'syncme/stable-25.0.2'
  workflow_dispatch:

concurrency:
  group: syncme-talk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Compile independent QA debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleQaDebug --no-daemon --stacktrace --console=plain 2>&1 | tee syncme-build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: syncme-talk-25.0.2-baseline-qa-debug
          path: app/build/outputs/apk/qa/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Summarize build failures
        if: failure()
        shell: bash
        run: |
          echo '## SyncMe Talk build failure' >> "$GITHUB_STEP_SUMMARY"
          echo 'Gradle errors:' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f syncme-build.log ]; then
            grep -E -A 8 '(^FAILURE:|^\\* What went wrong:|^> |^e: |^error: |Execution failed for task|Could not resolve|Could not find|What went wrong)' syncme-build.log | tail -n 120 >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo 'Build log not generated; check setup steps above.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syncme-build-log
          path: syncme-build.log
          if-no-files-found: warn
          retention-days: 14
