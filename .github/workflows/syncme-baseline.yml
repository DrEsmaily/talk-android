# SyncMe baseline build of the unmodified Nextcloud Talk 25.0.2 source.
# SPDX-License-Identifier: GPL-3.0-or-later
name: SyncMe Talk baseline APK
on:
  push:
    branches:
      - 'syncme/stable-25.0.2'
    paths-ignore:
      - 'ci-reports/**'
  workflow_dispatch:

concurrency:
  group: syncme-talk-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already include Android command-line SDK tools.
      # setup-android@v3 currently fails requesting the obsolete 'tools' package.
      - name: Locate Android SDK command line tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not present under Android SDK; installed tool directories:"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install Android API 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=3 | grep -E "platforms;android-37" | head -n 15 || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
          # AGP requests android-37 for integer compileSdk 37.
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Compile independent QA debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleQaDebug --no-daemon --stacktrace --console=plain 2>&1 | tee syncme-build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: syncme-talk-25.0.2-baseline-qa-debug
          path: app/build/outputs/apk/qa/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Summarize build failures
        if: failure()
        shell: bash
        run: |
          echo '## SyncMe Talk build failure' >> "$GITHUB_STEP_SUMMARY"
          echo 'Gradle errors:' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f syncme-build.log ]; then
            grep -E -A 8 '(^FAILURE:|^\\* What went wrong:|^> |^e: |^error: |Execution failed for task|Could not resolve|Could not find|What went wrong)' syncme-build.log | tail -n 120 >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo 'Build log not generated; check setup steps above.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Store redacted failure diagnostics in repository
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Failed build run: ${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Build details: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "---"
            if [ -f syncme-build.log ]; then
              grep -E '(^FAILURE:|^\\* What went wrong:|^> |^e: |^error: |Execution failed for task|Could not resolve|Could not find|Plugin .* was not found|No matching variant|SDK location not found)' syncme-build.log | tail -n 45 | cut -c 1-240 | sed -E 's#https?://[^ ]+#<URL>#g; s#(token|password|secret|key)=([^ ]+)#\\1=<redacted>#gi' || true
            else
              echo "Gradle log unavailable: failure occurred before compilation."
            fi
          } > /tmp/syncme-summary.txt
          # Persist to a dedicated branch-independent path. This diagnostics-only commit
          # is ignored by the workflow's push path filters, preventing an infinite loop.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-reports
          cp /tmp/syncme-summary.txt ci-reports/latest-failure.txt
          git add ci-reports/latest-failure.txt
          git -c core.hooksPath=/dev/null commit -m "ci: save redacted Talk failure [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syncme-build-log
          path: syncme-build.log
          if-no-files-found: warn
          retention-days: 14
